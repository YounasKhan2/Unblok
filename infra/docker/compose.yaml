name: unblok-dev
services:
  postgres:
    image: postgres:17.6-alpine@sha256:ef257d85f76e48da1c64832459b59fcaba1a4dac97bf5d7450c77753542eee94
    environment:
      POSTGRES_USER: unblok
      POSTGRES_DB: unblok
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in ignored infra/docker/.env}
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U unblok -d unblok"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    mem_limit: 512m
  valkey:
    image: valkey/valkey:8.1.3-alpine@sha256:d827e7f7552cdee40cc7482dbae9da020f42bc47669af6f71182a4ef76a22773
    environment:
      VALKEY_PASSWORD: ${VALKEY_PASSWORD:?Set VALKEY_PASSWORD in ignored infra/docker/.env}
    # Password comes from the container environment, never from a tracked file.
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - 'exec /usr/local/bin/docker-entrypoint.sh valkey-server --requirepass "$${VALKEY_PASSWORD}" --appendonly yes --maxmemory 128mb --maxmemory-policy noeviction'
    ports: ["127.0.0.1:6379:6379"]
    volumes: ["valkey-data:/data"]
    healthcheck:
      test: ["CMD-SHELL", 'REDISCLI_AUTH="$${VALKEY_PASSWORD}" valkey-cli ping | grep -q PONG']
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    mem_limit: 256m
  rustfs:
    image: rustfs/rustfs:1.0.0-alpha.83@sha256:1cfa82fb394a7c6a4ffc24f5333b52afee608d258503f94b37fcce5cc965c896
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:?Set RUSTFS_ACCESS_KEY in ignored infra/docker/.env}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:?Set RUSTFS_SECRET_KEY in ignored infra/docker/.env}
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ENABLE: "false"
      RUSTFS_OBS_LOGGER_LEVEL: warn
    ports: ["127.0.0.1:9000:9000"]
    volumes: ["rustfs-data:/data"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/health"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    mem_limit: 1g
  mailpit:
    image: axllent/mailpit:v1.27.8@sha256:6abc8e633df15eaf785cfcf38bae48e66f64beecdc03121e249d0f9ec15f0707
    environment:
      MP_DATABASE: /data/mailpit.db
      MP_MAX_MESSAGES: "500"
    ports: ["127.0.0.1:1025:1025", "127.0.0.1:8025:8025"]
    volumes: ["mailpit-data:/data"]
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    mem_limit: 128m
volumes:
  postgres-data:
  valkey-data:
  rustfs-data:
  mailpit-data:
